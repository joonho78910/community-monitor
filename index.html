<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>커뮤니티 동향 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#f5f6f8;--surface:#ffffff;--border:#e5e7eb;--border-strong:#d1d5db;
  --text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --accent:#1d4ed8;--accent-bg:#eef2ff;
  --positive:#059669;--negative:#dc2626;--neutral:#d97706;--mixed:#7c3aed;
  --shadow:0 1px 2px rgba(15,23,42,0.04),0 1px 3px rgba(15,23,42,0.06);
  color-scheme:light;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.55;font-feature-settings:"ss01","tnum","cv11";letter-spacing:-0.01em;}
.app{max-width:1400px;margin:0 auto;padding:28px 24px 80px;}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:16px;}
.header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em;}
.header .sub{color:var(--text-2);font-size:13px;margin-top:4px;}
.header-right{text-align:right;font-size:12px;color:var(--text-3);}
.controls{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;box-shadow:var(--shadow);}
.controls select{border:0;background:transparent;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;outline:none;color:var(--text);padding:4px 8px;}
.tabs{display:flex;gap:0;margin:0 0 20px;border-bottom:1px solid var(--border);}
.tab{background:transparent;border:0;padding:11px 22px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;letter-spacing:-0.01em;transition:all 0.15s;}
.tab:hover{color:var(--text-2);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.game-anchorpanic{--accent:#1d4ed8;--accent-bg:#eef2ff;}
.game-erpis{--accent:#7c3aed;--accent-bg:#f5f3ff;}
/* Status band v2 — bigger, more visual */
.status-band{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:18px 22px;margin-bottom:14px;border-radius:12px;border:1px solid;letter-spacing:-0.01em;position:relative;overflow:hidden;}
.status-band.status-green{background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 100%);color:#065f46;border-color:#86efac;}
.status-band.status-gray{background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);color:#334155;border-color:#cbd5e1;}
.status-band.status-yellow{background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%);color:#92400e;border-color:#fcd34d;}
.status-band.status-red{background:linear-gradient(135deg,#fef2f2 0%,#fee2e2 100%);color:#991b1b;border-color:#fca5a5;}
.status-left{display:flex;align-items:center;gap:14px;}
.status-icon{font-size:34px;line-height:1;}
.status-headline{display:flex;flex-direction:column;gap:2px;}
.status-headline .status-sub{font-size:11.5px;opacity:0.7;font-weight:500;letter-spacing:0.02em;}
.status-headline .status-label{font-size:22px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;}
.status-center{display:flex;flex-direction:column;gap:6px;min-width:0;}
.status-gauge{position:relative;height:10px;background:rgba(0,0,0,0.06);border-radius:5px;overflow:hidden;}
.status-gauge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width 0.5s ease;}
.status-band.status-green .status-gauge-fill{background:linear-gradient(90deg,#34d399,#10b981);}
.status-band.status-gray .status-gauge-fill{background:linear-gradient(90deg,#94a3b8,#64748b);}
.status-band.status-yellow .status-gauge-fill{background:linear-gradient(90deg,#fbbf24,#f59e0b);}
.status-band.status-red .status-gauge-fill{background:linear-gradient(90deg,#f87171,#ef4444);}
.status-factors{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:500;}
.status-factor{padding:3px 9px;border-radius:10px;background:rgba(255,255,255,0.6);border:1px solid rgba(0,0,0,0.05);}
.status-factor.bad{background:rgba(239,68,68,0.12);}
.status-factor.good{background:rgba(16,185,129,0.12);}
.status-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;}
.status-score{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.03em;}
.status-score .denom{font-size:14px;opacity:0.5;font-weight:600;margin-left:2px;}
.status-msg{font-size:11.5px;opacity:0.8;font-weight:500;}
.status-info{position:absolute;top:8px;right:10px;background:transparent;border:0;cursor:help;font-size:13px;opacity:0.4;padding:2px 4px;color:inherit;font-family:inherit;font-weight:600;line-height:1;}
.status-info:hover{opacity:1;}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);}
.card .label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px;}
.card .value{font-size:28px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1;}
.card .sub{font-size:11.5px;color:var(--text-2);margin-top:6px;font-variant-numeric:tabular-nums;}
.s-pos{color:var(--positive);}.s-neg{color:var(--negative);}.s-neu{color:var(--neutral);}.s-mix{color:var(--mixed);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow);}
.section h2{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:8px;}
.section h2 .count{background:var(--accent-bg);color:var(--accent);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;}
.summary-box{background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%);border-left:3px solid var(--accent);padding:16px 18px;border-radius:6px;color:var(--text);font-size:14.5px;line-height:1.75;margin-bottom:14px;letter-spacing:-0.01em;}
.summary-box strong{font-weight:600;color:var(--accent);}
.keywords{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;}
.keyword{background:#f1f5f9;color:var(--text);padding:6px 14px;border-radius:16px;font-weight:600;cursor:pointer;transition:all 0.18s;border:1px solid transparent;font-variant-numeric:tabular-nums;line-height:1.3;}
.keyword:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);transform:translateY(-1px);}
.keyword .cnt{opacity:0.55;font-weight:500;margin-left:6px;font-size:0.75em;}
.keyword.kw-rank-1{background:#fff7e6;color:#92400e;border-color:#fde68a;}
.keyword.kw-rank-2{background:#fef9c3;color:#854d0e;border-color:#fde047;}
.keyword.kw-rank-3{background:#ecfdf5;color:#065f46;border-color:#a7f3d0;}
.keyword.kw-neg{background:#fee2e2;color:#991b1b;border-color:#fecaca;}
.keyword.kw-pos{background:#d1fae5;color:#065f46;border-color:#a7f3d0;}
.issue-list,.bug-list,.t-list,.w-list,.c-list{list-style:none;padding:0;margin:0;}
.issue-item{padding:12px 0;border-bottom:1px solid #f1f5f9;}
.issue-item:last-child{border-bottom:0;}
.issue-item a{color:var(--text);text-decoration:none;display:flex;flex-direction:column;gap:5px;}
.issue-item a:hover .issue-title{color:var(--accent);}
.issue-title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;line-height:1.4;}
.issue-title .rank{font-variant-numeric:tabular-nums;color:var(--text-3);font-weight:500;font-size:12px;min-width:18px;}
.tone-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;letter-spacing:0;}
.tone-G{background:#d1fae5;color:#065f46;}.tone-B{background:#fee2e2;color:#991b1b;}.tone-N{background:#fef3c7;color:#92400e;}.tone-M{background:#ede9fe;color:#5b21b6;}
.issue-stats{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;display:flex;gap:14px;}
.issue-stats span{display:inline-flex;gap:4px;}
.issue-stats .lbl{color:var(--text-3);}
.section-note{font-size:11px;color:var(--text-3);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.t-item,.w-item,.c-item{padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:13px;display:flex;align-items:baseline;gap:10px;}
.t-item:last-child,.w-item:last-child,.c-item:last-child{border-bottom:0;}
.t-item .marker{color:var(--accent);font-weight:700;font-size:14px;line-height:1;}
.t-item .body{flex:1;color:var(--text);}
.t-item .pct{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;min-width:42px;text-align:right;}
.bug-item a{color:var(--text);text-decoration:none;display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;}
.bug-item:last-child a{border-bottom:0;}
.bug-item a:hover .bug-text{color:var(--accent);}
.bug-item .marker{color:var(--negative);font-weight:700;line-height:1;}
.empty{color:var(--text-3);font-style:italic;font-size:12.5px;padding:10px 0;}
.dist-bars{display:flex;flex-direction:column;gap:8px;}
.dist-row{display:grid;grid-template-columns:120px 1fr 65px;gap:10px;align-items:center;font-size:12px;}
.dist-label{color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px;}
.dist-dot{width:8px;height:8px;border-radius:50%;}
.dist-bar{position:relative;height:18px;background:#f1f5f9;border-radius:4px;overflow:hidden;}
.dist-fill{height:100%;border-radius:4px;transition:width 0.4s;}
.dist-pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--text);}
.post-table{width:100%;font-size:12.5px;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.post-table th{text-align:left;padding:10px 10px;background:#f8fafc;font-weight:600;color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;}
.post-table th.sortable{cursor:pointer;user-select:none;transition:background 0.15s;}
.post-table th.sortable:hover{background:#eef0f3;}
.post-table th.sortable::after{content:" \2195";opacity:0.3;font-size:10px;}
.post-table th.sort-asc::after{content:" \2191";opacity:1;color:var(--accent);}
.post-table th.sort-desc::after{content:" \2193";opacity:1;color:var(--accent);}
.post-table td{padding:10px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
.post-table tbody tr{transition:background 0.1s;}
.post-table tbody tr:hover{background:#fafbfc;}
.post-table a{color:var(--text);text-decoration:none;}
.post-table a:hover{color:var(--accent);text-decoration:underline;}
.src-arca,.src-dc{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;letter-spacing:0.02em;}
.src-arca{background:#fef3c7;color:#92400e;}.src-dc{background:#dbeafe;color:#1e40af;}
.tag-chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:3px;font-weight:600;letter-spacing:0;}
.tag-bug{background:#fee2e2;color:#991b1b;}.tag-negative{background:#fed7aa;color:#9a3412;}.tag-positive{background:#d1fae5;color:#065f46;}.tag-competitor{background:#ede9fe;color:#5b21b6;}.tag-newbie{background:#cffafe;color:#155e75;}.tag-guild{background:#fce7f3;color:#9d174d;}.tag-gacha{background:#fef3c7;color:#92400e;}.tag-event{background:#dcfce7;color:#166534;}.tag-balance{background:#dbeafe;color:#1e40af;}.tag-guide{background:#e0e7ff;color:#3730a3;}.tag-chitchat{background:#f1f5f9;color:#475569;}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border);}
.filter-grp{display:flex;gap:6px;align-items:center;}
.filter-grp+.filter-grp{margin-left:18px;padding-left:18px;border-left:1px solid var(--border);}
.filter-lbl{color:var(--text-3);font-size:11px;text-transform:uppercase;font-weight:600;letter-spacing:0.06em;margin-right:2px;}
.filter-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--text-2);font-weight:500;font-family:inherit;transition:all 0.12s;}
.filter-btn:hover{border-color:var(--border-strong);color:var(--text);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.search-input{padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;min-width:240px;outline:none;font-family:inherit;background:var(--surface);transition:border 0.15s;}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:var(--text-3);}
.posts-wrap{max-height:560px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;}
.muted{color:var(--text-3);}.small{font-size:11.5px;}
.title-cell{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.loading{padding:60px;text-align:center;color:var(--text-3);font-size:13px;}
.trend-insight{display:flex;flex-direction:column;gap:14px;}
.ti-block{font-size:12.5px;}
.ti-label{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;font-weight:600;}
.ti-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-variant-numeric:tabular-nums;}
.ti-row b{margin-left:auto;font-weight:700;}
.ti-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.ti-dot-anchor{background:#1d4ed8;}
.ti-dot-erpis{background:#7c3aed;}
.ti-foot{font-size:10.5px;color:var(--text-3);padding-top:8px;border-top:1px solid var(--border);margin-top:auto;}
.up{color:var(--positive);}.dn{color:var(--negative);}.flat{color:var(--text-3);}
/* Calendar (popup-style, refined) */
.cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;position:relative;flex-wrap:wrap;}
.cal-icon{font-size:14px;}
.cal-trigger{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;font-size:14px;color:var(--text);transition:all 0.15s;font-variant-numeric:tabular-nums;}
.cal-trigger:hover{border-color:var(--accent);background:var(--accent-bg);}
.cal-trigger.open{border-color:var(--accent);background:var(--accent-bg);}
.cal-trigger .sub{font-size:11.5px;color:var(--text-3);font-weight:500;}
.cal-trigger .caret{color:var(--text-3);font-size:9px;transition:transform 0.15s;}
.cal-trigger.open .caret{transform:rotate(180deg);color:var(--accent);}
.cal-nav{display:flex;gap:5px;align-items:center;margin-left:auto;}
.cal-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--text-2);font-family:inherit;font-weight:500;transition:all 0.12s;}
.cal-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.cal-btn:disabled{opacity:0.35;cursor:not-allowed;}
.cal-status{font-size:11.5px;color:var(--text-3);font-weight:500;}
.cal-popup{position:absolute;top:calc(100% + 8px);left:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 28px rgba(15,23,42,0.10),0 2px 6px rgba(15,23,42,0.05);padding:22px 26px 18px;display:none;align-items:flex-start;gap:22px;z-index:200;flex-wrap:wrap;}
.cal-popup.open{display:flex;animation:calFadeIn 0.18s ease-out;}
@keyframes calFadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.cal-popup-nav{background:transparent;border:0;color:var(--text-3);cursor:pointer;font-size:20px;padding:6px 8px;border-radius:50%;font-family:inherit;align-self:center;font-weight:300;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;transition:all 0.15s;}
.cal-popup-nav:hover:not(:disabled){background:var(--accent-bg);color:var(--accent);}
.cal-popup-nav:disabled{opacity:0.2;cursor:not-allowed;}
.cal-month-block{min-width:252px;}
.cal-month-title{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;padding:2px 0;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
.cal-weekdays-row{display:grid;grid-template-columns:repeat(7,34px);gap:0;font-size:11px;color:var(--text-3);font-weight:600;text-align:center;padding:4px 0 8px;}
.cal-weekdays-row .wk-sun{color:#dc2626;}
.cal-weekdays-row .wk-sat{color:#2563eb;}
.cal-days-grid{display:grid;grid-template-columns:repeat(7,34px);grid-auto-rows:34px;gap:0;}
.cal-day-cell{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);border-radius:50%;cursor:default;position:relative;font-variant-numeric:tabular-nums;background:transparent;transition:background 0.15s,color 0.15s;width:32px;height:32px;margin:1px;}
.cal-day-cell.empty{visibility:hidden;}
.cal-day-cell.has-data{background:#f1f5f9;color:#475569;font-weight:500;cursor:pointer;}
.cal-day-cell.has-data:hover{background:#e2e8f0;}
.cal-day-cell.spike{background:#6366f1;color:#fff;font-weight:700;}
.cal-day-cell.spike:hover{background:#4f46e5;color:#fff;}
.cal-day-cell.selected{background:#475569 !important;color:#fff !important;font-weight:700;}
.cal-day-cell.selected:hover{background:#334155 !important;}
.cal-day-cell.today::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);}
.cal-day-cell.today.selected::after{background:#fff;}
.game-erpis .cal-day-cell.has-data{background:#f1f5f9;color:#475569;}
.game-erpis .cal-day-cell.has-data:hover{background:#e2e8f0;}
.game-erpis .cal-day-cell.spike{background:#8b5cf6;color:#fff;font-weight:700;}
.game-erpis .cal-day-cell.spike:hover{background:#7c3aed;color:#fff;}
.cal-legend-inline{display:flex;align-items:center;gap:16px;font-size:11px;color:var(--text-3);margin-top:6px;padding-top:14px;border-top:1px solid var(--border);justify-content:center;flex-wrap:wrap;width:100%;}
.cal-legend-inline .lg-item{display:inline-flex;align-items:center;gap:6px;}
.cal-legend-inline .lg-swatch{width:12px;height:12px;border-radius:50%;}
/* Card deltas */
.card{position:relative;}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;font-variant-numeric:tabular-nums;vertical-align:middle;letter-spacing:-0.01em;line-height:1.5;}
.delta-good{background:#dcfce7;color:#166534;}
.delta-bad{background:#fee2e2;color:#991b1b;}
.delta-flat{background:#f1f5f9;color:#64748b;}

@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr);}.row{grid-template-columns:1fr;}}
</style></head>
<body>
<div class="app" id="app">
<div class="header">
  <div>
    <h1>커뮤니티 동향 대시보드</h1>
    <div class="sub">앵커패닉 · 에르피스 일일 모니터링</div>
  </div>
  <div class="header-right">
    <div id="meta-build" style="font-weight:600;color:var(--text-2);font-size:11.5px;letter-spacing:0.02em;"></div>
    <div id="meta-info" style="margin-top:2px;"></div>
  </div>
</div>
<div class="cal-wrap" id="cal-wrap">
  <span class="cal-icon">📅</span>
  <span style="font-size:11px;color:var(--text-2);text-transform:uppercase;font-weight:700;letter-spacing:0.08em;">일자 선택</span>
  <button class="cal-trigger" id="cal-trigger" type="button">
    <span id="cal-current">-</span>
    <span class="caret">▼</span>
  </button>
  <span class="cal-status" id="cal-status"></span>
  <div class="cal-nav">

<script>
const CATS=[
  {key:'community',label:'매칭/모집',tags:['newbie','guild'],color:'#0284c7'},
  {key:'gacha',label:'가챠/캐릭터',tags:['gacha'],color:'#d97706'},
  {key:'guide',label:'공략/콘텐츠',tags:['guide','balance'],color:'#0d9488'},
  {key:'positive',label:'호평',tags:['positive'],color:'#16a34a'},
  {key:'negative',label:'불만/버그',tags:['negative','bug'],color:'#dc2626'},
  {key:'event',label:'이벤트/외부',tags:['event','competitor'],color:'#7c3aed'},
  {key:'chitchat',label:'잡담',tags:['chitchat'],color:'#94a3b8'},
];
function fmtNum(n){return new Intl.NumberFormat("ko-KR").format(n);}
function fmtK(n){if(n>=10000)return (n/1000).toFixed(1)+'K';if(n>=1000)return (n/1000).toFixed(1)+'K';return fmtNum(n);}
function sentCls(s){if(s==="긍정")return"s-pos";if(s==="부정")return"s-neg";if(s==="혼합")return"s-mix";return"s-neu";}
function esc(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function tagL(t){return({bug:"버그",negative:"부정",positive:"긍정",competitor:"경쟁작",newbie:"뉴비",guild:"길드",gacha:"가챠",event:"이벤트",balance:"밸런스",guide:"공략",chitchat:"잡담"})[t]||t;}
function toneShort(t){return t==="긍정"?"G":t==="부정"?"B":t==="혼합"?"M":"N";}
function countGroup(posts,tags){return posts.filter(p=>(p.tags||[]).some(t=>tags.includes(t))).length;}
let trendsData=null;
let curData=null,prevData=null,actGame='',actSearch='',trendChart=null;
let allDates=[];
const dateCache={};
let suppressHash=false;
const fS={source:"all",tag:"all",search:"",idFilter:null,idFilterLabel:""};
const sS={field:"utcIso",dir:"desc"};

function todayKST(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);}
function relLabel(iso){
  const t=todayKST();
  if(iso===t)return '(오늘)';
  const d1=new Date(t+'T00:00:00Z').getTime();
  const d2=new Date(iso+'T00:00:00Z').getTime();
  const diff=Math.round((d1-d2)/86400000);
  if(diff===1)return '(어제)';
  if(diff===-1)return '(내일)';
  if(diff>0)return '('+diff+'일 전)';
  return '('+(-diff)+'일 후)';
}
function parseHash(){
  const h=location.hash.replace(/^#/,'');
  const p=new URLSearchParams(h);
  return {date:p.get('date'),game:p.get('game'),src:p.get('src')||'all',tag:p.get('tag')||'all',q:p.get('q')||'',sort:p.get('sort')||'utcIso',dir:p.get('dir')||'desc'};
}
function updateHash(){
  if(!curData||suppressHash)return;
  const p=new URLSearchParams();
  p.set('date',curData.date);
  if(actGame)p.set('game',actGame);
  if(fS.source!=='all')p.set('src',fS.source);
  if(fS.tag!=='all')p.set('tag',fS.tag);
  if(fS.search)p.set('q',fS.search);
  if(sS.field!=='utcIso')p.set('sort',sS.field);
  if(sS.dir!=='desc')p.set('dir',sS.dir);
  const newH='#'+p.toString();
  if(location.hash!==newH){history.replaceState(null,'',newH);}
}
function dayActivity(data){
  if(!data||!data.games)return {posts:0};
  let posts=0;
  Object.values(data.games).forEach(g=>{posts+=(g.stats&&g.stats.real_posts)||0;});
  return {posts};
}
function spikeOnDate(iso){
  // Use shared trendsData; filter by currently active game so spike marker reflects the tab
  const evs=(trendsData&&trendsData.events)||[];
  return evs.some(e=>e.date===iso && (!actGame || e.game===actGame));
}
let calViewMonth=null;
function buildMonthGrid(year,month0,sel,today){
  const first=new Date(Date.UTC(year,month0,1));
  const last=new Date(Date.UTC(year,month0+1,0));
  const firstWd=first.getUTCDay();
  const daysInMonth=last.getUTCDate();
  const cells=[];
  for(let i=0;i<firstWd;i++)cells.push({empty:true});
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(Date.UTC(year,month0,d));
    const iso=dt.toISOString().slice(0,10);
    cells.push({iso,day:d});
  }
  while(cells.length<42)cells.push({empty:true});
  return cells.map(c=>{
    if(c.empty)return '<div class="cal-day-cell empty"></div>';
    const has=allDates.includes(c.iso);
    const cd=dateCache[c.iso];
    const isSpike=spikeOnDate(c.iso);
    const isSel=c.iso===sel;
    const isToday=c.iso===today;
    const cls=['cal-day-cell'];
    if(has)cls.push('has-data');
    if(isSpike)cls.push('spike');
    if(isSel)cls.push('selected');
    if(isToday)cls.push('today');
    return '<div class="'+cls.join(' ')+'" data-d="'+c.iso+'">'+c.day+'</div>';
  }).join('');
}
function renderCalendar(){
  const popup=document.getElementById('cal-popup');
  const titleL=document.getElementById('cal-title-left');
  const titleR=document.getElementById('cal-title-right');
  const daysL=document.getElementById('cal-days-left');
  const daysR=document.getElementById('cal-days-right');
  if(!popup||!titleL)return;
  const today=todayKST();
  const sel=curData?curData.date:null;
  if(!calViewMonth){
    const base=sel?new Date(sel+'T00:00:00Z'):new Date(today+'T00:00:00Z');
    calViewMonth={year:base.getUTCFullYear(),month0:base.getUTCMonth()-1};
    if(calViewMonth.month0<0){calViewMonth.month0+=12;calViewMonth.year-=1;}
  }
  const leftY=calViewMonth.year, leftM=calViewMonth.month0;
  let rightY=leftY, rightM=leftM+1;
  if(rightM>11){rightM=0;rightY++;}
  titleL.textContent=leftY+'년 '+(leftM+1)+'월';
  titleR.textContent=rightY+'년 '+(rightM+1)+'월';
  daysL.innerHTML=buildMonthGrid(leftY,leftM,sel,today);
  daysR.innerHTML=buildMonthGrid(rightY,rightM,sel,today);
  popup.querySelectorAll('.cal-day-cell.has-data').forEach(el=>{
    el.onclick=()=>{const d=el.dataset.d;if(d&&d!==sel){closePopup();loadDate(d);}};
  });
  document.getElementById('cal-month-prev').onclick=async()=>{
    let m=calViewMonth.month0-1,y=calViewMonth.year;
    if(m<0){m=11;y--;}
    calViewMonth={year:y,month0:m};renderCalendar();
    await fetchVisibleMonths();renderCalendar();
  };
  document.getElementById('cal-month-next').onclick=async()=>{
    let m=calViewMonth.month0+1,y=calViewMonth.year;
    if(m>11){m=0;y++;}
    const tToday=new Date(todayKST()+'T00:00:00Z');
    const nextRightM=m+1>11?0:m+1;
    const nextRightY=y+(m+1>11?1:0);
    if(nextRightY>tToday.getUTCFullYear()||(nextRightY===tToday.getUTCFullYear()&&nextRightM>tToday.getUTCMonth()))return;
    calViewMonth={year:y,month0:m};renderCalendar();
    await fetchVisibleMonths();renderCalendar();
  };
  if(curData){
    const triggerLabel=document.getElementById('cal-current');
    triggerLabel.innerHTML=esc(curData.date)+' <span class="sub">'+relLabel(curData.date)+'</span>';
    const idx=allDates.indexOf(curData.date);
    document.getElementById('cal-prev').disabled=(idx>=allDates.length-1);
    document.getElementById('cal-next').disabled=(idx<=0);
    const statusEl=document.getElementById('cal-status');
    if(statusEl){
      const n=allDates.length;
      if(n<60)statusEl.innerHTML='누적 <b style="color:var(--accent);">'+n+'/60</b>일';
      else statusEl.textContent=n+'일 누적';
    }
  }
}
function openPopup(){const p=document.getElementById('cal-popup');const t=document.getElementById('cal-trigger');p.classList.add('open');t.classList.add('open');}
function closePopup(){const p=document.getElementById('cal-popup');const t=document.getElementById('cal-trigger');p.classList.remove('open');t.classList.remove('open');}
async function fetchVisibleMonths(){
  if(!calViewMonth)return;
  const y1=calViewMonth.year,m1=calViewMonth.month0;
  let y2=y1,m2=m1+1;if(m2>11){m2=0;y2++;}
  const inMonth=(iso,y,m)=>{const d=new Date(iso+'T00:00:00Z');return d.getUTCFullYear()===y&&d.getUTCMonth()===m;};
  const need=allDates.filter(d=>(inMonth(d,y1,m1)||inMonth(d,y2,m2))&&!dateCache[d]);
  if(need.length===0)return;
  await Promise.all(need.map(d=>fetch('data/'+d+'.json?ts='+Date.now()).then(r=>r.json()).then(j=>{dateCache[d]=j;}).catch(()=>{})));
}
async function togglePopup(){
  const p=document.getElementById('cal-popup');
  if(p.classList.contains('open')){closePopup();return;}
  openPopup();renderCalendar();
  await fetchVisibleMonths();
  renderCalendar(); // re-render with spike data
}
document.addEventListener('click',e=>{const w=document.getElementById('cal-wrap');if(w&&!w.contains(e.target)){closePopup();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup();});

async function loadIdx(){
  const r=await fetch('data/index.json?ts='+Date.now());
  const j=await r.json();
  allDates=j.dates.sort().reverse();
  // Fetch shared trends once
  try{const tr=await fetch('data/trends.json?ts='+Date.now());if(tr.ok)trendsData=await tr.json();}catch(e){trendsData=null;}
  document.getElementById('cal-prev').onclick=()=>{const idx=allDates.indexOf(curData&&curData.date);if(idx>=0&&idx<allDates.length-1)loadDate(allDates[idx+1]);};
  document.getElementById('cal-next').onclick=()=>{const idx=allDates.indexOf(curData&&curData.date);if(idx>0)loadDate(allDates[idx-1]);};
  document.getElementById('cal-latest').onclick=()=>{if(allDates[0]&&allDates[0]!==(curData&&curData.date))loadDate(allDates[0]);};
  document.getElementById('cal-trigger').onclick=togglePopup;
    // Lazy load: only fetch dates on demand. Calendar shows has-data from index.json directly.
  const hash=parseHash();
  if(hash.game)actGame=hash.game;
  fS.source=hash.src;fS.tag=hash.tag;fS.search=hash.q;
  sS.field=hash.sort;sS.dir=hash.dir;
  const initDate=(hash.date&&allDates.includes(hash.date))?hash.date:allDates[0];
  if(initDate)await loadDate(initDate);

async function loadDate(d){
  document.getElementById('game-content').innerHTML='<div class="loading">데이터 로딩 중...</div>';
  let data;
  if(dateCache[d]){data=dateCache[d];}
  else{const r=await fetch('data/'+d+'.json?ts='+Date.now());data=await r.json();dateCache[d]=data;}
  curData=data;
  calViewMonth=null;
  const idx=allDates.indexOf(d);
  if(idx>=0&&idx<allDates.length-1){
    const pd=allDates[idx+1];
    if(dateCache[pd]){prevData=dateCache[pd];}
    else{try{const r2=await fetch('data/'+pd+'.json?ts='+Date.now());prevData=await r2.json();dateCache[pd]=prevData;}catch(e){prevData=null;}}
  } else { prevData=null; }
  const games=Object.keys(curData.games);

  // version.json fetch & display: v0.2 · build 26.05.15.2
  try {
    const vr = await fetch('data/version.json?ts='+Date.now());
    if (vr.ok) {
      const v = await vr.json();
      const b = v.lastBuild || {};

      document.getElementById('meta-build').textContent = txt;
      if (b.uploadedAt) {
        const up = new Date(b.uploadedAt).toLocaleString('ko-KR', {timeZone:'Asia/Seoul'});
        document.getElementById('meta-info').textContent = '업데이트: ' + up;

function buildTabs(games){
  const el=document.getElementById('tabs');
  el.innerHTML='';
  games.forEach(key=>{

    btn.className='tab'+(key===actGame?' active':'');

    btn.onclick=()=>{actGame=key;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');renderCalendar();render();updateHash();};
    el.appendChild(btn);
  });
}
function deltaHtml(cur,prev,opts){
  opts=opts||{};
  if(prev==null||cur==null||isNaN(prev)||isNaN(cur))return '';
  const diff=cur-prev;
  if(Math.abs(diff)<(opts.eps||0.001)){return '<span class="delta delta-flat">→ 0</span>';}
  const goodOnUp=!opts.upIsBad;
  const cls=(diff>0)===goodOnUp?'delta-good':'delta-bad';
  const arrow=diff>0?'▲':'▼';
  let valStr;
  if(opts.pct){
    valStr=prev===0?'—':((diff/Math.abs(prev))*100).toFixed(0)+'%';
  } else if(opts.dp!=null){
    valStr=Math.abs(diff).toFixed(opts.dp);
  } else {
    valStr=fmtNum(Math.abs(diff));
  }
  return '<span class="delta '+cls+'">'+arrow+' '+valStr+'</span>';
}
function computeStatus(game, prev7Avg){
  const s=game.stats;
  const rp=s.real_posts||1;
  const negRatio=s.negative/rp;
  const posRatio=s.positive/rp;
  const bugs=s.bugs||0;
  const sent=s.sentiment_score||0;
  const lowVolume=rp<10;
  const sentLabel=s.sentiment||'중립';

  // Score (0-10) — v2 calibrated for game communities
  // 게임 커뮤니티 기준: 부정률 10~15%는 평범, 20%↑부터 이상
  let score=7;
  score+=sent*2.5;                              // sentiment 영향 약화 (3 → 2.5)
  score-=bugs*0.4;                              // 버그 페널티 약화 (0.5 → 0.4)
  score-=Math.max(0,negRatio-0.12)*12;          // 임계값 5%→12%, 가중치 20→12 (대폭 완화)
  score+=Math.max(0,posRatio-0.05)*5;           // 긍정률 보너스 신규 (5%↑면 가산)
  if(prev7Avg.bugs>0&&bugs>prev7Avg.bugs*2.5&&bugs>=3)score-=1;  // 평균의 2.5배 + 절대 3건 이상
  if(prev7Avg.negRatio>0&&negRatio>prev7Avg.negRatio*1.8&&negRatio>0.15)score-=0.6; // 1.8배 + 15% 이상
  score=Math.max(0,Math.min(10,score));

  // v2: 4-tier classification
  let status,label,icon;
  if(score>=7.0){status='green';label='정상';icon='🟢';}
  else if(score>=5.5){status='gray';label='평범';icon='⚪';}
  else if(score>=3.5){status='yellow';label='주의';icon='🟡';}
  else{status='red';label='경고';icon='🔴';}

  // Factor chips (good/bad/neutral)
  const factors=[
    {label:`감정 ${sentLabel}`, kind: sent>0.05?'good':(sent<-0.05?'bad':'')},
    {label:`버그 ${bugs}건`,    kind: bugs>=2?'bad':''},
    {label:`부정률 ${(negRatio*100).toFixed(1)}%`, kind: negRatio>0.20?'bad':(negRatio<0.05?'good':'')}
  ];
  if(posRatio>0.10) factors.push({label:`긍정률 ${(posRatio*100).toFixed(1)}%`, kind:'good'});

  // Interpretive message
  const reasons=[];
  if(bugs>=2)reasons.push(`버그 ${bugs}건`);
  if(negRatio>0.20)reasons.push(`부정률 ${(negRatio*100).toFixed(1)}%`);
  if(sent<-0.10&&!lowVolume)reasons.push('정서 부정 우세');
  if(prev7Avg.bugs>0&&bugs>prev7Avg.bugs*1.8&&bugs>=2)reasons.push(`버그 평소 ${(bugs/prev7Avg.bugs).toFixed(1)}배`);

  let msg;
  if(lowVolume){
    msg=`게시물 ${rp}건 — 활동 적음`;
  } else if(status==='green'){
    msg='호의적·이상 신호 없음';
  } else if(status==='gray'){
    msg='평소 수준 — 특이사항 없음';
  } else if(status==='yellow'){
    msg=reasons.slice(0,2).join(' · ')||'평균 대비 약간 저조';
  } else {
    msg=(reasons.slice(0,2).join(' · ')||'다중 이상')+' — 즉시 확인';
  }

  return {status,label,icon,score:score.toFixed(1),msg,factors};
}
function compute7DayAvg(curDate){
  // Compute prev-7-day averages for current game from dateCache
  const target=new Date(curDate+'T00:00:00Z').getTime();
  const dates=allDates.filter(d=>{
    const t=new Date(d+'T00:00:00Z').getTime();
    return t>=target-7*86400000 && t<target;
  });
  const samples=dates.map(d=>dateCache[d]).filter(x=>x&&x.games&&x.games[actGame]).map(x=>x.games[actGame].stats);
  if(samples.length===0)return {bugs:0,negRatio:0};
  const avgBugs=samples.reduce((a,b)=>a+(b.bugs||0),0)/samples.length;
  const avgNegRatio=samples.reduce((a,b)=>a+((b.negative||0)/Math.max(b.real_posts,1)),0)/samples.length;
  return {bugs:avgBugs,negRatio:avgNegRatio};
}
function render(){
  const game=curData.games[actGame];
  const s=game.stats,a=game.analysis||{};
  const app=document.getElementById('app');
  app.classList.remove('game-anchorpanic','game-erpis');
  app.classList.add('game-'+actGame);
  const real=game.posts.filter(p=>!(p.tags||[]).includes('notice'));
  const RP=real.length||1;
  const c=document.getElementById('game-content');
  const kwArr=(a.keywords||[]).slice(0,14);
  const maxCnt=kwArr.length?Math.max.apply(null,kwArr.map(k=>k.count||1)):1;
  const minCnt=kwArr.length?Math.min.apply(null,kwArr.map(k=>k.count||1)):1;
  const kw=kwArr.map((k,i)=>{
    const c=k.count||1;
    const size=maxCnt===minCnt?16:Math.round(13+(c-minCnt)/(maxCnt-minCnt)*9);
    let cls='keyword';
    const w=String(k.word||'');
    if(w.includes('불만')||w.includes('부정')) cls+=' kw-neg';
    else if(w.includes('긍정')||w.includes('회복')||w.includes('호평')) cls+=' kw-pos';
    else if(i===0) cls+=' kw-rank-1';
    else if(i===1) cls+=' kw-rank-2';
    else if(i===2) cls+=' kw-rank-3';
    const idsAttr=k.ids&&k.ids.length?' data-ids="'+esc(k.ids.join(','))+'"':'';

function renderTrendChart(st,activeGame){
  const canvas=document.getElementById('trendChart');

  if(trendChart){try{trendChart.destroy();}catch(e){}trendChart=null;}
  const game=st.series.find(s=>s.game===activeGame);
  if(!game||!game.data)return;

  const naverDataFull=isLegacyArray?game.data:(game.data.naver||[]);
  const googleDataFull=isLegacyArray?[]:(game.data.google||[]);

    const cMs=new Date(sliceCenter+'T00:00:00Z').getTime();
    const startMs=cMs-15*86400000;
    const endMs=cMs+14*86400000;
    return arr.filter(d=>{const t=new Date(d.period+'T00:00:00Z').getTime();return t>=startMs&&t<=endMs;});
  }
  const naverData=sliceCentered(naverDataFull);
  const googleData=sliceCentered(googleDataFull);

  googleData.forEach(d=>dateSet.add(d.period));

  const ptStyle=dates.map(d=>eventByDate[d]?'rectRot':'circle');
  const datasets=[{label:'네이버',data:nVals,borderColor:color,backgroundColor:fillBg,borderWidth:2.5,fill:true,tension:0.25,pointRadius:ptRadius,pointBackgroundColor:ptBg,pointBorderColor:ptBorder,pointBorderWidth:1.5,pointStyle:ptStyle,pointHoverRadius:7,spanGaps:true}];
  if(googleData.length){
    datasets.push({label:'구글',data:gVals,borderColor:color,borderDash:[6,4],borderWidth:1.6,fill:false,tension:0.25,pointRadius:2,pointHoverRadius:5,spanGaps:true});
  }
  trendChart=new Chart(canvas,{type:'line',data:{labels:dates.map(d=>d.slice(5)),datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',align:'end',labels:{boxWidth:14,boxHeight:3,font:{size:12}}},tooltip:{mode:'index',intersect:false,callbacks:{afterBody:function(ctxs){if(!ctxs||!ctxs.length)return '';const idx=ctxs[0].dataIndex;const d=dates[idx];const ev=eventByDate[d];if(!ev)return '';return ['','★'.repeat(ev.confidence)+' '+ev.label];}}}},scales:{y:{beginAtZero:true,suggestedMax:100,ticks:{stepSize:25,font:{size:11}},title:{display:true,text:'정규화 검색량 (max=100)',font:{size:11}}},x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:10,font:{size:11}}}},interaction:{mode:'index',intersect:false}}});
  const last=v=>{for(let i=v.length-1;i>=0;i--)if(v[i]!=null)return v[i];return null;};
  const prev=v=>{let f=null;for(let i=v.length-1;i>=0;i--){if(v[i]!=null){if(f===null)f=i;else return v[i];}}return null;};
  const avg=v=>{const f=v.filter(x=>x!=null);return f.length?f.reduce((a,b)=>a+b,0)/f.length:0;};
  const nLast=last(nVals),nPrev=prev(nVals),nAvg=avg(nVals);
  const gLast=last(gVals),gPrev=prev(gVals),gAvg=avg(gVals);
  function pct(c,r){if(r==null||r===0||c==null)return '<span class="flat">-</span>';const p=((c-r)/r*100);const cls=p>2?'up':p<-2?'dn':'flat';return '<span class="'+cls+'">'+(p>=0?'+':'')+p.toFixed(1)+'%</span>';}
  const fmt=v=>v==null?'-':v.toFixed(1);

  const rl=document.getElementById('trend-range');
  if(rl&&dates.length){

  }
  const insightEl=document.getElementById('trend-insight');
  if(insightEl){
    const dotN='style="background:'+color+';"';
    const dotG='style="background:'+color+';opacity:0.5;"';

    insightEl.innerHTML=html;

  const eventsEl=document.getElementById('trend-events');
  const countEl=document.getElementById('trend-events-count');
  if(eventsEl){
    if(gameEvents.length===0){
      eventsEl.innerHTML='<div class="empty">매칭된 주요 이벤트 없음</div>';
      if(countEl)countEl.textContent='0';

        return '<div class="event-card"><div class="ev-date">'+md+'</div><div class="ev-body"><span class="ev-stars">'+stars+'</span><span class="ev-label">'+esc(e.label)+'</span><div class="ev-detail">'+esc(e.detail||'')+(urlHtml?' · '+urlHtml:'')+'</div></div></div>';
      }).join('');

        if(hdr)hdr.insertAdjacentElement('afterend',banner);
      }
      banner.innerHTML='<span style="opacity:0.7;font-weight:500;">선택된 토픽:</span><span>#'+fS.idFilterLabel.replace(/[<>&]/g,'')+'</span><span style="opacity:0.7;font-weight:500;margin-left:auto;">'+filt.length+'건</span><button id="active-topic-clear" style="background:transparent;border:0;color:#3730a3;cursor:pointer;font-weight:600;font-size:13px;padding:2px 6px;">✕ 해제</button>';
      const btn=document.getElementById('active-topic-clear');
      if(btn)btn.onclick=()=>{fS.idFilter=null;fS.idFilterLabel='';renderList();updateHash();};
    } else if(banner){
      banner.remove();
    }
  }
  const f=sS.field,d=sS.dir;
  filt.sort((a,b)=>{
    let av,bv;
    if(f==='utcIso'){av=new Date(a.utcIso).getTime();bv=new Date(b.utcIso).getTime();}
    else {av=Number(a[f])||0;bv=Number(b[f])||0;}
    return d==='desc'?bv-av:av-bv;
  });
  body.innerHTML=filt.map(p=>{
    const dt=new Date(p.utcIso).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const tags=(p.tags||[]).map(t=>'<span class="tag-pill">'+tagL(t)+'</span>').join('');
    return '<tr><td><span class="src-'+p.source+'">'+p.source.toUpperCase()+'</span></td>'+
      '<td class="title-cell"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a></td>'+
      '<td>'+tags+'</td>'+
      '<td class="muted small">'+dt+'</td>'+
      '<td style="text-align:right;">'+fmtNum(p.views)+'</td>'+
      '<td style="text-align:right;">'+p.comments+'</td>'+
      '<td style="text-align:right;">'+p.likes+'</td></tr>';
  }).join('');
}
window.addEventListener('hashchange',()=>{
  const h=parseHash();
  if(!h.date||!curData)return;
  if(h.date!==curData.date&&allDates.includes(h.date)){
    suppressHash=true;
    if(h.game)actGame=h.game;
    fS.source=h.src;fS.tag=h.tag;fS.search=h.q;
    sS.field=h.sort;sS.dir=h.dir;
    loadDate(h.date).then(()=>{suppressHash=false;});
  } else if(h.game&&h.game!==actGame){
    actGame=h.game;render();renderCalendar();
  }
});
loadIdx();
</script></body></html>
