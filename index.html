<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {

.app {

.header {

.header h1 {

.header .sub {

.tabs {

}
.tab {

  border: 0;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #707783;
  border-bottom: 2px solid transparent;
  transition: all 0.15s ease;
}
.tab.active {

  border-bottom-color: var(--accent);
}
.tab:hover { color: #1a1d23; }
.game-anchorpanic { --accent: #1976d2; --accent-bg: #e3f0fd; }
.game-erpis { --accent: #7c3aed; --accent-bg: #f1ebfd; }

}
.card {

}
.card .label {

  margin-bottom: 4px;

}
.card .value {

}

  color: #4a525e;
  font-weight: 500;

.small { font-size: 11.5px; }

function fmtNum(n) {
  return new Intl.NumberFormat("ko-KR").format(n);
}
function sentimentClass(s) {
  if (s === "긍정" || s === "positive") return "sentiment-positive";
  if (s === "부정" || s === "negative") return "sentiment-negative";
  if (s === "혼합" || s === "mixed") return "sentiment-mixed";
  return "sentiment-neutral";
}

const data = window.DATA;
const games = Object.keys(data.games);
let activeGame = localStorage.getItem("activeGame") || games[0];
if (!games.includes(activeGame)) activeGame = games[0];

// 마지막 업데이트 시간
const lu = new Date(data.lastUpdated);
document.getElementById("last-updated").textContent =
  `마지막 업데이트: ${lu.getFullYear()}-${String(lu.getMonth()+1).padStart(2,"0")}-${String(lu.getDate()).padStart(2,"0")} ${String(lu.getHours()).padStart(2,"0")}:${String(lu.getMinutes()).padStart(2,"0")}`;

// 탭 빌드
const tabsEl = document.getElementById("tabs");
games.forEach(key => {
  const btn = document.createElement("button");
  btn.className = "tab";
  btn.textContent = data.games[key].name;
  if (key === activeGame) btn.classList.add("active");
  btn.addEventListener("click", () => {
    activeGame = key;
    localStorage.setItem("activeGame", key);
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
  tabsEl.appendChild(btn);
});

// 필터 상태
const filterState = {
  source: "all",
  tag: "all",
  search: "",
};

  allSec.className = "section";
  allSec.innerHTML = `
    <h2>📋 전체 게시물 <span class="count">${game.posts.length}</span></h2>
    <div class="filters">
      <span class="muted small">소스</span>
      <button class="filter-btn" data-filter-type="source" data-filter-value="all">전체</button>
      <button class="filter-btn" data-filter-type="source" data-filter-value="arca">아카라이브</button>
      <button class="filter-btn" data-filter-type="source" data-filter-value="dc">DC</button>
      <span class="muted small" style="margin-left: 12px;">태그</span>
      <button class="filter-btn" data-filter-type="tag" data-filter-value="all">전체</button>
      <button class="filter-btn" data-filter-type="tag" data-filter-value="bug">🐛 버그</button>
      <button class="filter-btn" data-filter-type="tag" data-filter-value="negative">😡 부정</button>
      <button class="filter-btn" data-filter-type="tag" data-filter-value="positive">😊 긍정</button>
      <button class="filter-btn" data-filter-type="tag" data-filter-value="competitor">⚔️ 경쟁작</button>
      <button class="filter-btn" data-filter-type="tag" data-filter-value="newbie">🌱 뉴비/복귀</button>
      <input type="text" class="search-input" placeholder="제목 검색..." id="search-input">
    </div>
    <div style="max-height: 480px; overflow-y: auto;">
      <table class="post-table">
        <thead><tr>
          <th style="width:50px;">소스</th>
          <th>제목</th>
          <th style="width:90px;">태그</th>
          <th style="width:70px;">날짜</th>
          <th style="width:60px; text-align:right;">조회</th>
          <th style="width:50px; text-align:right;">댓글</th>
          <th style="width:50px; text-align:right;">추천</th>
        </tr></thead>
        <tbody id="all-posts-body"></tbody>
      </table>
    </div>
  `;
  content.appendChild(allSec);

  // 필터 버튼 초기 active 상태
  document.querySelectorAll(`[data-filter-type="source"]`).forEach(b => {
    if (b.dataset.filterValue === filterState.source) b.classList.add("active");
  });
  document.querySelectorAll(`[data-filter-type="tag"]`).forEach(b => {
    if (b.dataset.filterValue === filterState.tag) b.classList.add("active");
  });

  // 필터 이벤트
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.addEventListener("click", () => {
      const type = b.dataset.filterType;
      const val = b.dataset.filterValue;
      filterState[type] = val;
      document.querySelectorAll(`[data-filter-type="${type}"]`).forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      renderPostList();
    });
  });
  document.getElementById("search-input").addEventListener("input", e => {
    filterState.search = e.target.value.toLowerCase();
    renderPostList();
  });

  renderPostList();
  renderChart(game);
}

function renderPostList() {
  const game = data.games[activeGame];
  const body = document.getElementById("all-posts-body");
  if (!body) return;
  const filtered = game.posts.filter(p => {
    if (filterState.source !== "all" && p.source !== filterState.source) return false;
    if (filterState.tag !== "all" && !p.tags.includes(filterState.tag)) return false;
    if (filterState.search && !p.title.toLowerCase().includes(filterState.search)) return false;
    return true;
  });
  const sorted = filtered.sort((a, b) => b.engagement - a.engagement);
  body.innerHTML = sorted.map(p => `
    <tr>
      <td><span class="source-${p.source}">${p.source.toUpperCase()}</span></td>
      <td class="title-cell"><a href="${p.url}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a></td>
      <td>${p.tags.filter(t => t !== "notice").map(t => `<span class="tag-chip tag-${t}">${tagLabel(t)}</span>`).join("")}</td>
      <td class="small muted">${escapeHtml(p.date)}</td>
      <td style="text-align:right;">${fmtNum(p.views)}</td>
      <td style="text-align:right;">${p.comments}</td>
      <td style="text-align:right;">${p.likes}</td>
    </tr>
  `).join("") || `<tr><td colspan="7" style="text-align:center; padding:20px; color:#707783;">조건에 맞는 게시물이 없습니다.</td></tr>`;
}

function tagLabel(t) {
  const labels = { bug: "버그", negative: "부정", positive: "긍정", competitor: "경쟁작", newbie: "뉴비" };
  return labels[t] || t;
}

let currentChart = null;
function renderChart(game) {
  const ctx = document.getElementById("chart-dist");
  if (!ctx) return;
  if (currentChart) currentChart.destroy();
  // 카테고리별 게시물 수 (notice 제외)
  const real = game.posts.filter(p => !p.tags.includes("notice"));
  const tagCounts = {
    "🐛 버그": real.filter(p => p.tags.includes("bug")).length,
    "😡 부정": real.filter(p => p.tags.includes("negative")).length,
    "😊 긍정": real.filter(p => p.tags.includes("positive")).length,
    "⚔️ 경쟁작": real.filter(p => p.tags.includes("competitor")).length,
    "🌱 뉴비/복귀": real.filter(p => p.tags.includes("newbie")).length,
    "기타": real.filter(p => p.tags.length === 0).length,
  };
  const colors = ["#dc2626", "#f97316", "#16a34a", "#7c3aed", "#0284c7", "#94a3b8"];
  currentChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: Object.keys(tagCounts),
      datasets: [{
        data: Object.values(tagCounts),
        backgroundColor: colors,
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "right", labels: { font: { size: 11 } } },
      }
    }
  });
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

render();
</script>
</body>
</html>
