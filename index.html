<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>커뮤니티 동향 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  background: #f7f8fa;
  color: #1a1d23;
  font-size: 14px;
  line-height: 1.5;
}
.app {
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}
.header {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 22px;
}
.header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header .sub {
  color: #707783;
  font-size: 13px;
}
.tabs {
  display: flex;
  gap: 6px;
  margin: 20px 0 18px;
  border-bottom: 1px solid #e3e6eb;
}
.tab {
  background: transparent;
  border: 0;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #707783;
  border-bottom: 2px solid transparent;
  transition: all 0.15s ease;
}
.tab.active {
  color: #1a1d23;
  border-bottom-color: var(--accent);
}
.tab:hover { color: #1a1d23; }
.game-anchorpanic { --accent: #1976d2; --accent-bg: #e3f0fd; }
.game-erpis { --accent: #7c3aed; --accent-bg: #f1ebfd; }
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.card {
  background: #ffffff;
  border: 1px solid #e3e6eb;
  border-radius: 10px;
  padding: 14px 16px;
}
.card .label {
  font-size: 11px;
  color: #707783;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.card .value {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.card .sub {
  font-size: 11px;
  color: #707783;
  margin-top: 2px;
}
.sentiment-positive { color: #16a34a; }
.sentiment-negative { color: #dc2626; }
.sentiment-neutral { color: #ca8a04; }
.sentiment-mixed { color: #7c3aed; }
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.section {
  background: #ffffff;
  border: 1px solid #e3e6eb;
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 14px;
}
.section h2 {
  margin: 0 0 12px;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section h2 .count {
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.summary-box {
  background: var(--accent-bg);
  border-left: 3px solid var(--accent);
  padding: 14px 16px;
  border-radius: 6px;
  color: #2c303a;
  font-size: 13.5px;
  line-height: 1.65;
}
.issue-list, .trend-list, .watch-list, .bug-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.issue-item {
  padding: 12px 0;
  border-bottom: 1px solid #f0f2f5;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.issue-item:last-child { border-bottom: 0; }
.issue-title {
  font-weight: 600;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tone-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}
.tone-긍정 { background: #dcfce7; color: #166534; }
.tone-부정 { background: #fee2e2; color: #991b1b; }
.tone-중립 { background: #fef3c7; color: #92400e; }
.tone-혼합 { background: #ede9fe; color: #5b21b6; }
.issue-summary { font-size: 12.5px; color: #4a525e; }
.simple-list-item {
  padding: 8px 0;
  border-bottom: 1px dashed #f0f2f5;
  font-size: 13px;
}
.simple-list-item:last-child { border-bottom: 0; }
.simple-list-item::before {
  content: "•";
  color: var(--accent);
  font-weight: 700;
  margin-right: 8px;
}
.post-table {
  width: 100%;
  font-size: 12.5px;
  border-collapse: collapse;
}
.post-table th {
  text-align: left;
  padding: 10px 8px;
  background: #f7f8fa;
  font-weight: 600;
  color: #4a525e;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  border-bottom: 1px solid #e3e6eb;
  position: sticky;
  top: 0;
}
.post-table td {
  padding: 10px 8px;
  border-bottom: 1px solid #f0f2f5;
  vertical-align: middle;
}
.post-table tbody tr:hover {
  background: #f9fafb;
}
.post-table a {
  color: var(--accent);
  text-decoration: none;
}
.post-table a:hover { text-decoration: underline; }
.source-arca, .source-dc {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}
.source-arca { background: #fde68a; color: #78350f; }
.source-dc { background: #c7d2fe; color: #3730a3; }
.tag-chip {
  display: inline-block;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-right: 2px;
  font-weight: 600;
}
.tag-bug { background: #fee2e2; color: #991b1b; }
.tag-negative { background: #fed7aa; color: #9a3412; }
.tag-positive { background: #bbf7d0; color: #14532d; }
.tag-competitor { background: #ddd6fe; color: #5b21b6; }
.tag-newbie { background: #bae6fd; color: #075985; }
.tag-notice { background: #e5e7eb; color: #374151; }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.filter-btn {
  background: #fff;
  border: 1px solid #e3e6eb;
  border-radius: 16px;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
  color: #4a525e;
  font-weight: 500;
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.filter-btn:hover:not(.active) { background: #f0f2f5; }
.search-input {
  padding: 6px 12px;
  border: 1px solid #e3e6eb;
  border-radius: 16px;
  font-size: 12px;
  min-width: 200px;
  outline: none;
}
.search-input:focus { border-color: var(--accent); }
.chart-wrap {
  position: relative;
  height: 220px;
  width: 100%;
}
.muted { color: #707783; }
.small { font-size: 11.5px; }
.flex { display: flex; align-items: center; gap: 8px; }
.actions {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.btn {
  background: var(--accent);
  color: #fff;
  border: 0;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { opacity: 0.9; }
.btn-outline {
  background: #fff;
  color: var(--accent);
  border: 1px solid var(--accent);
}
#deep-analysis {
  display: none;
  background: #f7f8fa;
  border-radius: 8px;
  padding: 14px 16px;
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
}
#deep-analysis.show { display: block; }
.competitor-empty {
  color: #707783;
  font-style: italic;
  font-size: 13px;
  padding: 8px 0;
}
.title-cell {
  max-width: 340px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media (max-width: 900px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
  .row { grid-template-columns: 1fr; }
}
</style>
</head>

function fmtNum(n) {
  return new Intl.NumberFormat("ko-KR").format(n);
}
function sentimentClass(s) {
  if (s === "긍정" || s === "positive") return "sentiment-positive";
  if (s === "부정" || s === "negative") return "sentiment-negative";
  if (s === "혼합" || s === "mixed") return "sentiment-mixed";
  return "sentiment-neutral";
}

const data = window.DATA;
const games = Object.keys(data.games);
let activeGame = localStorage.getItem("activeGame") || games[0];
if (!games.includes(activeGame)) activeGame = games[0];

// 마지막 업데이트 시간
const lu = new Date(data.lastUpdated);
document.getElementById("last-updated").textContent =
  `마지막 업데이트: ${lu.getFullYear()}-${String(lu.getMonth()+1).padStart(2,"0")}-${String(lu.getDate()).padStart(2,"0")} ${String(lu.getHours()).padStart(2,"0")}:${String(lu.getMinutes()).padStart(2,"0")}`;

// 탭 빌드
const tabsEl = document.getElementById("tabs");
games.forEach(key => {
  const btn = document.createElement("button");
  btn.className = "tab";
  btn.textContent = data.games[key].name;
  if (key === activeGame) btn.classList.add("active");
  btn.addEventListener("click", () => {
    activeGame = key;
    localStorage.setItem("activeGame", key);
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
  tabsEl.appendChild(btn);
});

function renderPostList() {
  const game = data.games[activeGame];
  const body = document.getElementById("all-posts-body");
  if (!body) return;
  const filtered = game.posts.filter(p => {
    if (filterState.source !== "all" && p.source !== filterState.source) return false;
    if (filterState.tag !== "all" && !p.tags.includes(filterState.tag)) return false;
    if (filterState.search && !p.title.toLowerCase().includes(filterState.search)) return false;
    return true;
  });
  const sorted = filtered.sort((a, b) => b.engagement - a.engagement);
  body.innerHTML = sorted.map(p => `
    <tr>
      <td><span class="source-${p.source}">${p.source.toUpperCase()}</span></td>
      <td class="title-cell"><a href="${p.url}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a></td>
      <td>${p.tags.filter(t => t !== "notice").map(t => `<span class="tag-chip tag-${t}">${tagLabel(t)}</span>`).join("")}</td>
      <td class="small muted">${escapeHtml(p.date)}</td>
      <td style="text-align:right;">${fmtNum(p.views)}</td>
      <td style="text-align:right;">${p.comments}</td>
      <td style="text-align:right;">${p.likes}</td>
    </tr>
  `).join("") || `<tr><td colspan="7" style="text-align:center; padding:20px; color:#707783;">조건에 맞는 게시물이 없습니다.</td></tr>`;
}

function tagLabel(t) {
  const labels = { bug: "버그", negative: "부정", positive: "긍정", competitor: "경쟁작", newbie: "뉴비" };
  return labels[t] || t;
}

let currentChart = null;
function renderChart(game) {
  const ctx = document.getElementById("chart-dist");
  if (!ctx) return;
  if (currentChart) currentChart.destroy();
  // 카테고리별 게시물 수 (notice 제외)
  const real = game.posts.filter(p => !p.tags.includes("notice"));
  const tagCounts = {
    "🐛 버그": real.filter(p => p.tags.includes("bug")).length,
    "😡 부정": real.filter(p => p.tags.includes("negative")).length,
    "😊 긍정": real.filter(p => p.tags.includes("positive")).length,
    "⚔️ 경쟁작": real.filter(p => p.tags.includes("competitor")).length,
    "🌱 뉴비/복귀": real.filter(p => p.tags.includes("newbie")).length,
    "기타": real.filter(p => p.tags.length === 0).length,
  };
  const colors = ["#dc2626", "#f97316", "#16a34a", "#7c3aed", "#0284c7", "#94a3b8"];
  currentChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: Object.keys(tagCounts),
      datasets: [{
        data: Object.values(tagCounts),
        backgroundColor: colors,
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "right", labels: { font: { size: 11 } } },
      }
    }
  });
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

render();
</script>
</body>
</html>
